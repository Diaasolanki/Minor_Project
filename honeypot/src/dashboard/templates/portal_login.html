<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TechCorp Portal — Sign In</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;align-items:center;
      justify-content:center;background:#0e0e1a;color:#e0e0e0;}
  .card{width:100%;max-width:380px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
       border-radius:20px;padding:40px 36px;}
  .logo{text-align:center;margin-bottom:26px;}
  .logo .dot{width:52px;height:52px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:14px;
            display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px;}
  .logo h1{font-size:19px;font-weight:700;color:#fff;}
  .logo p{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px;}
  .form-group{margin-bottom:16px;}
  label{display:block;font-size:12.5px;color:rgba(255,255,255,.6);margin-bottom:6px;}
  input{width:100%;padding:12px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
       border-radius:10px;font-size:14px;color:#fff;outline:none;}
  input:focus{border-color:#667eea;}
  button{width:100%;padding:12px;margin-top:6px;background:linear-gradient(135deg,#667eea,#764ba2);
        border:none;border-radius:10px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;}
  button:hover{opacity:.92;}
  .error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;
        padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center;}
  .foot{margin-top:18px;font-size:11px;color:rgba(255,255,255,.3);text-align:center;}
  .foot a{color:rgba(255,255,255,.35);}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="dot">&#127970;</div>
    <h1>TechCorp Portal</h1>
    <p>Employee Intranet &middot; Sign in to continue</p>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST" action="/portal/login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password">
    </div>
    <button type="submit">Sign In</button>
  </form>
  <div class="foot">v3.1.2 &middot; <a href="/dashboard">honeypot dashboard</a></div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Administration — Dashboard</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Segoe UI",Arial,sans-serif;min-height:100vh;background:#160b0b;color:#e0e0e0;
      display:flex;align-items:center;justify-content:center;}
  .card{max-width:480px;background:rgba(255,255,255,.04);border:1px solid rgba(239,68,68,.15);
       border-radius:18px;padding:40px;text-align:center;}
  .shield{font-size:40px;margin-bottom:14px;}
  h1{font-size:19px;color:#fff;margin-bottom:8px;}
  p{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6;}
  a{display:inline-block;margin-top:20px;color:#fca5a5;font-size:12.5px;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="shield">&#128737;</div>
  <h1>Welcome, Administrator</h1>
  <p>You have full access to system configuration, user management, and audit logs.
     This session has been recorded.</p>
  <a href="/portal/login">&larr; Back to main portal</a>
</div>
</body>
</html>
